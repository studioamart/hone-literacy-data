name: Validate Hone Literacy reading data

# GitHub Pages serves main directly. Validate the corpus and its committed
# manifest in one revision so readers never observe a transient data/manifest
# mismatch.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/**'
      - 'content/**'
      - 'scripts/**'
      - '.github/workflows/update-data.yml'
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'content/**'
      - 'scripts/**'
      - '.github/workflows/update-data.yml'

permissions:
  contents: read

concurrency:
  group: validate-reading-data-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test data tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Validate optional distractor review parity
        run: |
          python3 scripts/materialize-distractor-reviews.py \
            --corpus data/passages.json \
            --snapshot content/corpus-snapshots/bundled-v11-question-semantics.json

      - name: Audit corpus
        run: python3 scripts/audit-corpus.py --strict

      - name: Validate complete year pack when present
        shell: bash
        run: |
          if compgen -G 'content/year-of-readings-2026/batch-*.json' > /dev/null; then
            python3 scripts/validate-year-pack.py
            python3 scripts/year_pack_parity.py
          else
            echo 'No year-pack batches present; skipping year-pack validation.'
          fi

      # The og-fig-* pack ships no batch file, so this checker is its authoring
      # source of truth rather than a duplicate of the corpus audit.
      - name: Validate the figurative-language and tone pack
        run: python3 scripts/validate-fig-pack.py

      - name: Report readability review candidates
        run: python3 scripts/audit-readability.py

      # ubuntu-24.04's documented runner image includes Swift. This checks the
      # same Codable shape consumed by the app without requiring Xcode.
      - name: Decode corpus with Swift model
        run: swift scripts/validate-swift-decode.swift data/passages.json

      - name: Rebuild and validate manifest
        run: node scripts/build-manifest.mjs

      - name: Require committed manifest to match corpus
        shell: bash
        run: |
          manifest_status="$(git status --porcelain=v1 --untracked-files=all -- data/manifest.json)"
          if [[ -n "$manifest_status" ]]; then
            git diff -- data/manifest.json
            printf '%s\n' "$manifest_status"
            echo '::error file=data/manifest.json::Manifest is stale. Run node scripts/build-manifest.mjs and commit data/manifest.json with the corpus change.'
            exit 1
          fi
